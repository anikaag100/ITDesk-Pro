version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: it_resolver_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: it_resolver_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d it_resolver_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - resolver_net

  # 2. FastAPI Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: it_resolver_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/it_resolver_db
      - ENVIRONMENT=production
      - SECRET_KEY=production_secret_key_change_in_production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - resolver_net

  # 3. React Frontend Service (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: it_resolver_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - resolver_net

volumes:
  postgres_data:
    driver: local

networks:
  resolver_net:
    driver: bridge
